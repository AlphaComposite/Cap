services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: wire-a-local-only
      MYSQL_DATABASE: capwire
      MYSQL_USER: wire
      MYSQL_PASSWORD: wire-a-local-only
    ports:
      - "127.0.0.1:13316:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: wire-a-local
      MINIO_ROOT_PASSWORD: wire-a-local-only
    ports:
      - "127.0.0.1:19010:9000"
    command: ["server", "/data"]
