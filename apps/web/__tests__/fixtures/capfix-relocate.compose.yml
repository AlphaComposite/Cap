services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: capfix-local-only
      MYSQL_DATABASE: capfix
    ports:
      - "127.0.0.1:33016:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: capfix-local
      MINIO_ROOT_PASSWORD: capfix-local-only
    ports:
      - "127.0.0.1:33910:9000"
    command: ["server", "/data"]
