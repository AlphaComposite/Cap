name: capwire-b-origin

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cap
      MYSQL_ROOT_PASSWORD: capwire-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3116:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcapwire-root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql:/var/lib/mysql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: capwire
      MINIO_ROOT_PASSWORD: capwire-minio-secret
    ports:
      - "127.0.0.1:3117:9000"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 capwire capwire-minio-secret && mc mb local/cap --ignore-existing"]

  origin:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      ORIGIN_BIND: 0.0.0.0
      ORIGIN_PORT: "3020"
      ORIGIN_HOST_PUBLISH: 127.0.0.1
      ORIGIN_CACHE: /var/cache/origin
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_BUCKET: cap
      S3_ACCESS_KEY: capwire
      S3_SECRET_KEY: capwire-minio-secret
      S3_REGION: us-east-1
      ORIGIN_DATABASE_URL: mysql://root:capwire-root@mysql:3306/cap
      ORIGIN_GRANT_SECRET: capwire-grant-secret-capwire-grant-secret
      ORIGIN_SERVICE_TOKEN: capwire-service-token-capwire-service-token
    ports:
      - "127.0.0.1:3119:3020"
    cpus: "1.5"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3020/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - cache:/var/cache/origin

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - origin
    ports:
      - "127.0.0.1:3118:8080"
    volumes:
      - ./smoke/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/styrir/scratch/cap-fzp-8-wire/build-b-origin/player:/player:ro

volumes:
  mysql:
  minio:
  cache:
