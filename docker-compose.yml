name: cap
services:
  cap-web:
    container_name: cap-web
    image: ${CAP_WEB_IMAGE:-cap-web:latest}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD:-cap-local-pwd-123}@mysql:3306/cap
      WEB_URL: ${CAP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${CAP_URL:-http://localhost:3000}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:-fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
      CAP_AWS_ACCESS_KEY: ${MINIO_ROOT_USER:-cap-admin}
      CAP_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cap-minio-pwd-456}
      CAP_AWS_BUCKET: cap
      CAP_AWS_REGION: us-east-1
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: 'true'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN:-}
      ASSEMBLY_API_KEY: ${ASSEMBLY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_STREAM_MODEL: ${AI_STREAM_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_COMPATIBLE_MODEL: ${AI_COMPATIBLE_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://cap-web:3000
      CAP_ALLOWED_SIGNUP_DOMAINS: ${CAP_ALLOWED_SIGNUP_DOMAINS:-}
      CAP_CHROME_EXTENSION_ID: ${CAP_CHROME_EXTENSION_ID:-}
    ports:
    - 127.0.0.1:${CAP_PORT:-3010}:3000
    healthcheck:
      test:
      - CMD-SHELL
      - pidof nscd >/dev/null && node -e "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
    - cap-network
    mem_limit: ${CAP_WEB_MEMORY:-4g}
    cpus: ${CAP_WEB_CPUS:-2}
    volumes:
    - ./data/workflow:/app/apps/web/.workflow-data
  media-server:
    container_name: cap-media-server
    image: ${MEDIA_SERVER_IMAGE:-cap-media-server:latest}
    build:
      context: ./apps/media-server
      dockerfile: Dockerfile.standalone
    restart: unless-stopped
    environment:
      PORT: 3456
      MEDIA_TRANSCODE_THREADS: ${MEDIA_TRANSCODE_THREADS:-6}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:-fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - 'fetch(''http://127.0.0.1:3456/health'').then((response) => process.exit(response.ok
        ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
    - cap-network
  instant-finish-origin:
    restart: unless-stopped
    user: 65532:65532
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ORIGIN_BIND: 0.0.0.0
      ORIGIN_PORT: '3020'
      ORIGIN_HOST_PUBLISH: 127.0.0.1
      ORIGIN_CACHE: /var/cache/origin
      ORIGIN_WARM_TTL_S: ${ORIGIN_WARM_TTL_S:-600}
      ORIGIN_MAX_KEEP_RANGES: ${ORIGIN_MAX_KEEP_RANGES:-1024}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_BUCKET: cap
      S3_REGION: us-east-1
    ports:
    - 127.0.0.1:${ORIGIN_PORT:-3020}:3020
    volumes:
    - instant-finish-origin-cache:/var/cache/origin
    cpus: ${ORIGIN_CPUS:-2}
    mem_limit: ${ORIGIN_MEMORY:-4g}
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3020/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
    - cap-network
    image: ${ORIGIN_IMAGE:-cap-origin:latest}
    pull_policy: never
    container_name: cap-instant-finish-origin
  mysql:
    container_name: cap-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cap-local-pwd-123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cap-root-pwd-789}
    command:
    - --max_connections=1000
    - --default-authentication-plugin=mysql_native_password
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    volumes:
    - cap-mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - -u
      - cap
      - -p${MYSQL_PASSWORD:-cap-local-pwd-123}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - cap-network
  minio:
    container_name: cap-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cap-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cap-minio-pwd-456}
    ports:
    - 127.0.0.1:${MINIO_PORT:-9010}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001
    volumes:
    - cap-minio-data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
    - cap-network
  minio-setup:
    container_name: cap-minio-setup
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: '/bin/sh -c " mc alias set capminio http://minio:9000 $${MINIO_ROOT_USER:-cap-admin}
      $${MINIO_ROOT_PASSWORD:-cap-minio-pwd-456}; mc mb capminio/cap --ignore-existing;
      exit 0; "

      '
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cap-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cap-minio-pwd-456}
    networks:
    - cap-network
volumes:
  cap-mysql-data: null
  cap-minio-data: null
  instant-finish-origin-cache: null
networks:
  cap-network:
    driver: bridge
