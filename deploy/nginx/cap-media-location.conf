# Insert this location before `location /` in the cap.example.com server.
# Do not add it to the s3.example.com server. No proxy_cache. No new tunnel host.
# Query bearers must not reach the access log. See README-instant-finish.md.
location /media/ {
	access_log off;
	proxy_pass http://127.0.0.1:3020;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Host $host;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_cache off;
	proxy_no_cache 1;
	proxy_cache_bypass 1;
	add_header Cache-Control "private, no-store" always;
	add_header Pragma "no-cache" always;
	add_header Referrer-Policy "no-referrer" always;
}
